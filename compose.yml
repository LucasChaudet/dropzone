# Stack complète DropZone : base PostgreSQL, API FastAPI, front React servi par nginx.
# Lancement : copier .env.example en .env, puis `docker compose up -d --build`.

name: dropzone

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copier .env.example en .env}
      POSTGRES_USER: ${POSTGRES_USER:?copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas interpolée par Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      # Dans le réseau Compose, la base s'appelle "db" (son nom de service), pas localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    build: ./frontend
    ports:
      - "${FRONT_PORT:-8080}:8080"
    depends_on:
      # Le front attend que l'API réponde (HEALTHCHECK de l'image), sinon nginx renvoie des 502.
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
